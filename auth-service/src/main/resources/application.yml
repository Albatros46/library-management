server:
  port: 8081
  error:
    include-message: always
spring:
  application:
    name: auth-service
  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://localhost:27017/library_management}
      auto-index-creation: true
library:
  jwt:
    secret: ${JWT_SECRET:change-me-this-is-a-dev-only-secret-of-at-least-32-bytes}
    ttl: PT8H
  admin:
    email: ${ADMIN_EMAIL:admin@library.local}
    password: ${ADMIN_PASSWORD:admin123}
